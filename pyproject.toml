[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-lens-ryan-vo"
version = "1.0.0"
description = "A web-based AI/ML debugger for inspecting, searching, and understanding vector embeddings and model internals"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["ai", "ml", "embeddings", "debugger", "vector-search", "onnx", "clustering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.33",
    "onnxruntime>=1.19.0",
    "torch>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/A220man/vector-lens-ryan-vo"
Repository = "https://github.com/A220man/vector-lens-ryan-vo"
Issues = "https://github.com/A220man/vector-lens-ryan-vo/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "UP", "B", "C4", "PTH", "SIM", "T20", "W"]
ignore = ["S101", "S311", "B008"]
extend-per-file-ignores = ["backend/tests/*": ["S101", "S311"]]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
namespace_packages = true
explicit_package_bases = true